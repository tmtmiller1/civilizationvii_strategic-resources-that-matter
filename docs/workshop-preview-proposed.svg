<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Proposed Workshop / identity emblem for Strategic Resources (a draft for the owner; docs/workshop-preview.svg is
     still the placeholder release.sh renders). Matches the Tower-mods family look (dark ground, gold frame, parchment
     art, serif wordmark). Motif: one land hex with an open mine, three ingots stacked at its mouth, one of them
     missing from the top row: the copy you are short of. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243042"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7eed1"/>
      <stop offset="100%" stop-color="#e7d4a3"/>
    </linearGradient>
    <linearGradient id="ingot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3bf6a"/>
      <stop offset="100%" stop-color="#a7782c"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5a46"/>
      <stop offset="100%" stop-color="#3e3328"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7d4a3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e7d4a3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hexclip">
      <polygon points="812,430 662,689.8 362,689.8 212,430 362,170.2 662,170.2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Gold frame to echo the in-game parchment/gold palette -->
  <rect x="26" y="26" width="972" height="972" rx="30" fill="none" stroke="#c9a24c" stroke-width="4" opacity="0.5"/>

  <!-- Light over the tile -->
  <circle cx="512" cy="430" r="340" fill="url(#glow)"/>

  <!-- The tile: one land hex -->
  <polygon points="812,430 662,689.8 362,689.8 212,430 362,170.2 662,170.2"
           fill="url(#parchment)" stroke="#c9a24c" stroke-width="6" stroke-linejoin="round"/>

  <g clip-path="url(#hexclip)">
    <!-- The hill the mine is cut into -->
    <path d="M212,560 Q330,330 512,300 Q694,330 812,560 L812,700 L212,700 Z" fill="url(#rock)"/>
    <path d="M300,560 Q400,420 512,395 Q624,420 724,560 Z" fill="#2a2e38" opacity="0.35"/>
    <!-- The mine mouth: a timbered arch -->
    <path d="M432,560 L432,470 Q512,400 592,470 L592,560 Z" fill="#14161c"/>
    <g fill="none" stroke="#c9a24c" stroke-width="10" stroke-linecap="round">
      <path d="M420,560 L420,466 Q512,386 604,466 L604,560"/>
      <line x1="420" y1="500" x2="604" y2="500"/>
    </g>
    <!-- The ground before the mine -->
    <rect x="212" y="560" width="600" height="140" fill="#c9a24c" opacity="0.18"/>
  </g>

  <!-- Three ingots at the mouth, the top row one short -->
  <g stroke="#7a5a1e" stroke-width="4" stroke-linejoin="round" fill="url(#ingot)">
    <polygon points="386,632 466,632 452,596 400,596"/>
    <polygon points="474,632 554,632 540,596 488,596"/>
    <polygon points="562,632 642,632 628,596 576,596"/>
    <polygon points="430,594 510,594 496,558 444,558"/>
  </g>
  <!-- The missing one: an outline only -->
  <polygon points="518,594 598,594 584,558 532,558" fill="none" stroke="#f7eed1" stroke-width="4"
           stroke-dasharray="10 8" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="512" y="776" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="88"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">STRATEGIC</text>
  <text x="512" y="866" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="88"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">RESOURCES</text>
  <!-- Tagline -->
  <text x="512" y="934" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="36"
        fill="#c9a24c" opacity="0.92">Horses &#183; Iron &#183; Niter &#183; Oil &#183; Coal &#183; Rubber</text>
</svg>
